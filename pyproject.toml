[project]
name = "coding-agent-harness"
version = "0.1.0"
description = "Model-agnostic coding agent harness built on the OpenHands SDK"
requires-python = ">=3.12"
dependencies = [
    # openhands-sdk and openhands-tools are a MATCHED SET: keep the two version
    # specifiers identical and upgrade them together, or imports will break.
    # Pin to an exact version once a working one is confirmed, e.g. "==X.Y.Z".
    "openhands-sdk",
    "openhands-tools",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Uncomment when enabling sandboxed/remote execution (HARNESS_EXECUTION=docker):
# sandbox = ["openhands-workspace", "openhands-agent-server"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"